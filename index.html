<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avengers Character Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>Avengers Character Search</h1>
  </header>

  <main>
    <form id="search-form">
      <label for="search">Search by Full Name or Alias</label>
      <div class="search-row">
        <input type="text" id="search" name="query" placeholder="e.g. Captain America or Steve Rogers" autocomplete="off">
        <button type="submit" id="search-btn">Search</button>
      </div>
    </form>

    <section>
      <h2>Result</h2>
      <div id="result"></div>
    </section>
  </main>
</body>
</html>
